<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PESHO PANEL</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: black;
    color: white;
    overflow: hidden;
}

/* Title */
h1 {
    text-align: center;
    color: yellow;
}

/* Center box */
.container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.7);
    padding: 20px;
    border-radius: 10px;
    text-align: center;
}

/* Inputs */
input {
    padding: 10px;
    margin: 10px;
    border: none;
    outline: none;
    width: 200px;
}

/* Button */
button {
    padding: 10px 20px;
    background: yellow;
    border: none;
    cursor: pointer;
}

/* Toggle */
.toggle {
    display: flex;
    justify-content: space-between;
    margin: 10px;
    width: 250px;
}

/* Switch */
.switch {
    position: relative;
    width: 50px;
    height: 25px;
}

.switch input {
    display: none;
}

.slider {
    position: absolute;
    background: grey;
    width: 100%;
    height: 100%;
    border-radius: 20px;
    cursor: pointer;
}

.slider:before {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    background: white;
    top: 2px;
    left: 2px;
    border-radius: 50%;
    transition: 0.3s;
}

input:checked + .slider {
    background: yellow;
}

input:checked + .slider:before {
    transform: translateX(25px);
}

/* Message */
#msg {
    margin-top: 10px;
    color: yellow;
}

/* Canvas particles */
canvas {
    position: absolute;
    top: 0;
    left: 0;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<!-- LOGIN PAGE -->
<div id="login" class="container">
    <h1>PESHO <span style="color:white;">PANEL</span></h1>
    <input type="text" id="user" placeholder="Username"><br>
    <input type="password" id="pass" placeholder="Password"><br>
    <button onclick="login()">Login</button>
</div>

<!-- PANEL PAGE -->
<div id="panel" class="container" style="display:none;">
    <h1>PESHO <span style="color:white;">PANEL</span></h1>

    <div class="toggle">Aimbot
        <label class="switch">
            <input type="checkbox" onchange="activate('Aimbot')">
            <span class="slider"></span>
        </label>
    </div>

    <div class="toggle">Location
        <label class="switch">
            <input type="checkbox" onchange="activate('Location')">
            <span class="slider"></span>
        </label>
    </div>

    <div class="toggle">Aim Fav
        <label class="switch">
            <input type="checkbox" onchange="activate('Aim Fav')">
            <span class="slider"></span>
        </label>
    </div>

    <div class="toggle">No Recoil
        <label class="switch">
            <input type="checkbox" onchange="activate('No Recoil')">
            <span class="slider"></span>
        </label>
    </div>

    <div class="toggle">Wall Hack
        <label class="switch">
            <input type="checkbox" onchange="activate('Wall Hack')">
            <span class="slider"></span>
        </label>
    </div>

    <div class="toggle">Speed Hack
        <label class="switch">
            <input type="checkbox" onchange="activate('Speed Hack')">
            <span class="slider"></span>
        </label>
    </div>

    <div id="msg"></div>
</div>

<script>
// LOGIN SYSTEM
function login() {
    let u = document.getElementById("user").value;
    let p = document.getElementById("pass").value;

    if(u === "PESHO" && p === "hu") {
        document.getElementById("login").style.display = "none";
        document.getElementById("panel").style.display = "block";
    } else {
        alert("Wrong login!");
    }
}

// TOGGLE FUNCTION
function activate(name) {
    let msg = document.getElementById("msg");
    msg.innerHTML = name + " activating...";

    setTimeout(() => {
        msg.innerHTML = name + " Activated ✅";
    }, 3000);
}

// PARTICLES
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for(let i=0; i<100; i++){
    particles.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        size: Math.random()*3,
        speed: Math.random()*1
    });
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "yellow";

    particles.forEach(p=>{
        p.y += p.speed;
        if(p.y > canvas.height) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
    });

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
