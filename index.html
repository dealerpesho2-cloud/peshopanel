<!DOCTYPE html>
<html>
<head>
<title>REAL KEYAUTH TEST</title>
<style>
body{background:black;color:white;text-align:center;font-family:Arial;padding-top:50px}
input,button{padding:10px;margin:5px}
#panel{display:none;color:lime}
</style>
</head>

<body>

<h2>KEYAUTH REAL LOGIN DEMO</h2>

<input id="user" placeholder="username"><br>
<input id="pass" placeholder="password"><br>
<button onclick="login()">LOGIN</button>

<p id="msg"></p>

<div id="panel">
  <h3>ACCESS GRANTED ✅</h3>
</div>

<script>

function login(){

  let user = document.getElementById("user").value;
  let pass = document.getElementById("pass").value;

  document.getElementById("msg").innerText = "Checking...";

  fetch("https://keyauth.win/api/1.2/", {
    method: "POST",
    body: new URLSearchParams({
      type: "login",
      username: user,
      pass: pass,
      // 👇 yahan tum apni real KeyAuth values lagao
      name: "PESHOOO",
      ownerid: "i0kM50D4JH",
      secret: "084ecfaa2c9d4307137599da7d248d9033cea583533d5572a291f4a4c8265420",
      version: "1.0"
    })
  })
  .then(res => res.json())
  .then(data => {

    if(data.success){
      document.getElementById("msg").innerText = "Login Success";
      document.getElementById("panel").style.display = "block";
    } 
    else {
      document.getElementById("msg").innerText = "Invalid Login";
    }

  })
  .catch(err => {
    document.getElementById("msg").innerText = "Error connecting API";
  });

}

</script>

</body>
</html>
