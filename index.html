<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>PESHO PANEL</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: black;
    color: white;
    overflow: hidden;
    touch-action: manipulation;
}

h1 {
    text-align: center;
    color: yellow;
}

.container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.7);
    padding: 20px;
    border-radius: 10px;
    text-align: center;
}

input {
    padding: 10px;
    margin: 10px;
    border: none;
    outline: none;
    width: 200px;
}

button {
    padding: 10px 20px;
    background: yellow;
    border: none;
    cursor: pointer;
}

/* Toggle box */
.toggle {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 10px;
    width: 250px;

    border: 2px solid yellow;
    border-radius: 10px;
    padding: 8px;
    box-shadow: 0 0 10px yellow, 0 0 20px yellow;

    box-sizing: border-box;
    overflow: hidden;
}

/* CHECKBOX STYLE */
.toggle input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: yellow;
    cursor: pointer;
    margin-left: auto;
}

#msg {
    margin-top: 10px;
    color: yellow;
}

#deviceInfo {
    font-size: 12px;
    margin-bottom: 15px;
    text-align: left;
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
}

/* ✅ WELCOME ANIMATION */
#welcome {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 22px;
    color: yellow;
    text-shadow: 0 0 10px yellow, 0 0 20px lime;
    padding: 20px;
    border: 2px solid yellow;
    border-radius: 10px;
    background: rgba(0,0,0,0.8);
    animation: pop 1s ease-in-out;
    z-index: 9999;
}

@keyframes pop {
    0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}
</style>
</head>

<body>

<audio id="loginSound" src="login.mp3"></audio>

<canvas id="canvas"></canvas>

<div id="login" class="container">
    <h1>PESHO <span style="color:white;">PANEL</span></h1>
    <input type="text" id="user" placeholder="Username"><br>
    <input type="password" id="pass" placeholder="Password"><br>
    <button onclick="login()">Login</button>
</div>

<div id="panel" class="container" style="display:none;">
    <h1>PESHO <span style="color:white;">PANEL</span></h1>

    <div id="deviceInfo">Loading...</div>

    <div class="toggle">Enable all functions
        <input type="checkbox" onchange="activate(event,'All Functions')">
    </div>

    <div class="toggle">Enable ESP
        <input type="checkbox" onchange="activate(event,'ESP')">
    </div>

    <div class="toggle">Aimbot
        <input type="checkbox" onchange="activate(event,'Aimbot')">
    </div>

    <div class="toggle">Location
        <input type="checkbox" onchange="activate(event,'Location')">
    </div>

    <div class="toggle">Aim Fav
        <input type="checkbox" onchange="activate(event,'Aim Fav')">
    </div>

    <div class="toggle">No Recoil
        <input type="checkbox" onchange="activate(event,'No Recoil')">
    </div>

    <div class="toggle">Wall Hack
        <input type="checkbox" onchange="activate(event,'Wall Hack')">
    </div>

    <div class="toggle">Speed Hack
        <input type="checkbox" onchange="activate(event,'Speed Hack')">
    </div>

    <div id="msg"></div>
</div>

<script>

let runningSequence = null;

// LOGIN SYSTEM
function login() {
    let u = document.getElementById("user").value;
    let p = document.getElementById("pass").value;

    if(u === "PESHO" && p === "hu") {
        document.getElementById("login").style.display = "none";
        document.getElementById("panel").style.display = "block";

        document.getElementById("loginSound").play();
        loadDeviceInfo();

        showWelcome(); // ✅ ADDED
    } else {
        let phone = "923715445880";
        let message = "Contact to the Owner to get your username & password";
        window.location.href = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
    }
}

// ✅ WELCOME MESSAGE
function showWelcome() {
    let div = document.createElement("div");
    div.id = "welcome";
    div.innerHTML = " WELCOME TO PESHO PANEL ";

    document.body.appendChild(div);

    setTimeout(() => {
        div.style.opacity = "0";
        div.style.transition = "1s";
        setTimeout(() => div.remove(), 1000);
    }, 5000);
}

// DEVICE INFO
function loadDeviceInfo() {
    let info = "";

    info += "<b>Status:</b> " + (navigator.onLine ? "Online 🟢" : "Offline 🔴") + "<br>";

    if (navigator.getBattery) {
        navigator.getBattery().then(function(battery) {
            let level = Math.floor(battery.level * 100);
            let charging = battery.charging ? "⚡ Charging" : "🔋 Not Charging";

            info += "<b>Battery:</b> " + level + "%<br>";
            info += "<b>Mode:</b> " + charging;

            document.getElementById("deviceInfo").innerHTML = info;
        });
    } else {
        info += "<b>Battery:</b> Not Supported";
        document.getElementById("deviceInfo").innerHTML = info;
    }
}

// TOGGLES
function activate(event, name) {
    let msg = document.getElementById("msg");
    let isChecked = event.target.checked;

    if (name === "All Functions") {

        let boxes = document.querySelectorAll('#panel input[type="checkbox"]');

        let targets = Array.from(boxes).filter(b =>
            !b.getAttribute("onchange") || !b.getAttribute("onchange").includes("All Functions")
        );

        if (isChecked) {
            msg.innerHTML = "<span style='color:white'>Status :</span> Enabling all functions...";

            targets.forEach((box, i) => {
                runningSequence = setTimeout(() => {
                    box.checked = true;
                    activate({target: box}, box.parentElement.textContent.trim());
                }, i * 5000);
            });

        } else {
            msg.innerHTML = "<span style='color:white'>Status :</span> Disabling all functions...";

            targets.reverse().forEach((box, i) => {
                runningSequence = setTimeout(() => {
                    box.checked = false;
                    activate({target: box}, box.parentElement.textContent.trim());
                }, i * 5000);
            });
        }

        return;
    }

    if (isChecked) {
        msg.innerHTML = "<span style='color:white'>Status :</span> " + name + " activating...";
        setTimeout(() => {
            msg.innerHTML = "<span style='color:white'>Status :</span> " + name + " Activated ✅";
        }, 3000);
    } else {
        msg.innerHTML = "<span style='color:white'>Status :</span> " + name + " deactivating...";
        setTimeout(() => {
            msg.innerHTML = "<span style='color:white'>Status :</span> " + name + " Deactivated ❌";
        }, 3000);
    }
}

// PARTICLES
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for(let i=0; i<100; i++){
    particles.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        size: Math.random()*3,
        speed: Math.random()*1
    });
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "yellow";

    particles.forEach(p=>{
        p.y += p.speed;
        if(p.y > canvas.height) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
    });

    requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
