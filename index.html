<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>PESHO PANEL</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: black;
    color: white;
    overflow: hidden;
}

h1 {
    text-align: center;
    color: yellow;
    text-shadow: 0 0 10px yellow, 0 0 20px yellow;
}

.container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.95);
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    border: 1px solid rgba(255,255,0,0.3);
    box-shadow: 0 0 20px rgba(255,255,0,0.2);
    transition: 0.3s;
}

.container:hover {
    transform: translate(-50%, -50%) scale(1);
}

input {
    padding: 12px;
    margin: 10px;
    border: 2px solid yellow;
    outline: none;
    width: 220px;
    background: transparent;
    color: white;
    text-align: center;
    border-radius: 8px;
    transition: 0.3s;
}

input:focus {
    box-shadow: 0 0 10px yellow, 0 0 20px yellow;
}

button {
    padding: 12px 25px;
    background: yellow;
    border: none;
    cursor: pointer;
    border-radius: 8px;
    font-weight: bold;
    transition: 0.3s;
}

button:hover {
    background: black;
    color: yellow;
    box-shadow: 0 0 15px yellow;
}

.toggle {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 10px;
    width: 260px;
    border-radius: 12px;
    padding: 10px;
    background: rgba(255,255,0,0.05);
    border: 1px solid rgba(255,255,0,0.3);
    box-shadow: inset 0 0 10px rgba(255,255,0,0.1);
    transition: 0.3s;
}

.toggle:hover {
    box-shadow: 0 0 10px yellow;
}

.toggle input[type="checkbox"] {
    width: 22px;
    height: 22px;
    accent-color: yellow;
    cursor: pointer;
}

#msg {
    margin-top: 10px;
    color: yellow;
    font-size: 14px;
    font-family: monospace;
}

#deviceInfo {
    font-size: 12px;
    margin-bottom: 15px;
    text-align: left;
    opacity: 0.8;
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
}

#welcome {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    font-size: 22px;
    color: yellow;
    text-shadow: 0 0 10px yellow, 0 0 30px lime;
    padding: 20px;
    border-radius: 10px;
    background: rgba(0,0,0,0.8);
    border: 2px solid yellow;
    animation: pop 0.6s ease;
    z-index: 9999;
}

@keyframes pop {
    from {transform: translate(-50%, -50%) scale(0.3); opacity:0;}
    to {transform: translate(-50%, -50%) scale(1); opacity:1;}
}
</style>
</head>

<body>

<audio id="loginSound" src="login.mp3"></audio>
<audio id="startSound" src="start.mp3"></audio>

<audio id="aimbotSound" src="aimbot.mp3"></audio>
<audio id="locationSound" src="location.mp3"></audio>
<audio id="aimfavSound" src="aimfav.mp3"></audio>
<audio id="norecoilSound" src="norecoil.mp3"></audio>
<audio id="wallhackSound" src="wallhack.mp3"></audio>
<audio id="speedhackSound" src="speedhack.mp3"></audio>

<canvas id="canvas"></canvas>

<div id="login" class="container">
    <h1>PESHO <span style="color:white;">PANEL</span></h1>
    <input type="text" id="user" placeholder="Username"><br>
    <input type="password" id="pass" placeholder="Password"><br>
    <button onclick="login()">Login</button>
</div>

<div id="panel" class="container" style="display:none;">
    <h1>PESHO <span style="color:white;">PANEL</span></h1>

    <div id="deviceInfo">Loading...</div>

    <div class="toggle">Enable all functions
        <input type="checkbox" onchange="activate(event,'All Functions')">
    </div>

    <div class="toggle">Aimbot
        <input type="checkbox" onchange="activate(event,'Aimbot')">
    </div>

    <div class="toggle">Location
        <input type="checkbox" onchange="activate(event,'Location')">
    </div>

    <div class="toggle">Aim Fav
        <input type="checkbox" onchange="activate(event,'Aim Fav')">
    </div>

    <div class="toggle">No Recoil
        <input type="checkbox" onchange="activate(event,'No Recoil')">
    </div>

    <div class="toggle">Wall Hack
        <input type="checkbox" onchange="activate(event,'Wall Hack')">
    </div>

    <div class="toggle">Speed Hack
        <input type="checkbox" onchange="activate(event,'Speed Hack')">
    </div>

    <div id="msg"></div>
</div>

<script>

let runningSequence = null;

function login() {
    let u = document.getElementById("user").value;
    let p = document.getElementById("pass").value;

    if(u === "PESHO" && p === "000") {
        document.getElementById("login").style.display = "none";
        document.getElementById("panel").style.display = "block";

        document.getElementById("loginSound").play();
        loadDeviceInfo();
        showWelcome();
    } else {
        let phone = "923715445880";
        let message = "Contact to the Owner to get your username & password";
        window.location.href = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
    }
}

function showWelcome() {
    let div = document.createElement("div");
    div.id = "welcome";
    div.innerHTML = " WELCOME TO PESHO PANEL ";
    document.body.appendChild(div);

    setTimeout(() => {
        div.style.opacity = "0";
        setTimeout(() => div.remove(), 1000);
    }, 3000);
}

function loadDeviceInfo() {
    let info = "";
    info += "<b>Status:</b> " + (navigator.onLine ? "Online 🟢" : "Offline 🔴") + "<br>";

    if (navigator.getBattery) {
        navigator.getBattery().then(function(battery) {
            let level = Math.floor(battery.level * 100);
            let charging = battery.charging ? "⚡ Charging" : "🔋 Not Charging";

            info += "<b>Battery:</b> " + level + "%<br>";
            info += "<b>Mode:</b> " + charging;

            document.getElementById("deviceInfo").innerHTML = info;
        });
    } else {
        info += "<b>Battery:</b> Not Supported";
        document.getElementById("deviceInfo").innerHTML = info;
    }
}

function activate(event, name) {
    let msg = document.getElementById("msg");
    let isChecked = event.target.checked;

    let startSound = document.getElementById("startSound");

    function playFinalSound(name){
        if(name === "Aimbot") document.getElementById("aimbotSound").play();
        if(name === "Location") document.getElementById("locationSound").play();
        if(name === "Aim Fav") document.getElementById("aimfavSound").play();
        if(name === "No Recoil") document.getElementById("norecoilSound").play();
        if(name === "Wall Hack") document.getElementById("wallhackSound").play();
        if(name === "Speed Hack") document.getElementById("speedhackSound").play();
    }

    if (name === "All Functions") {

        let boxes = document.querySelectorAll('#panel input[type="checkbox"]');

        let targets = Array.from(boxes).filter(b =>
            !b.getAttribute("onchange") || !b.getAttribute("onchange").includes("All Functions")
        );

        if (isChecked) {
            msg.innerHTML = ">>> SYSTEM: INITIALIZING ALL MODULES...";

            targets.forEach((box, i) => {
                setTimeout(() => {
                    box.checked = true;
                    activate({target: box}, box.parentElement.textContent.trim());
                }, i * 5000);
            });

        } else {
            msg.innerHTML = ">>> SYSTEM: SHUTTING DOWN ALL MODULES...";

            targets.reverse().forEach((box, i) => {
                setTimeout(() => {
                    box.checked = false;
                    activate({target: box}, box.parentElement.textContent.trim());
                }, i * 5000);
            });
        }

        return;
    }

    if (isChecked) {
        msg.innerHTML = ">>> [" + name.toUpperCase() + "] INITIALIZING...";
        startSound.currentTime = 0;
        startSound.play();

        setTimeout(() => {
            msg.innerHTML = ">>> [" + name.toUpperCase() + "] STATUS: ACTIVE [✓]";
            playFinalSound(name);
        }, 3000);

    } else {
        msg.innerHTML = ">>> [" + name.toUpperCase() + "] TERMINATING...";
        startSound.currentTime = 0;
        startSound.play();

        setTimeout(() => {
            msg.innerHTML = ">>> [" + name.toUpperCase() + "] STATUS: OFFLINE [✗]";
        }, 3000);
    }
}

let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for(let i=0; i<100; i++){
    particles.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        size: Math.random()*3,
        speed: Math.random()*1
    });
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "yellow";

    particles.forEach(p=>{
        p.y += p.speed;
        if(p.y > canvas.height) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
    });

    requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
